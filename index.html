const todayKey = (d = new Date()) => {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
};

const addDaysKey = (key, n) => {
  const [y,m,d] = key.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + n);
  return todayKey(dt);
};

const weekdayOf = (key) => {
  const [y,m,d] = key.split('-').map(Number);
  return new Date(y, m-1, d).getDay();
};

const formatDate = (key) => {

// ============== MIGRATION ==============
function migrate(data) {
  if (!data) return buildDefaultData();
  if (data.version === APP_VERSION) return data;

  try {
    // ---- v2 -> v3: wrap steps in default trip ----
    if (data.version === 2 || (!data.version && data.morningSteps)) {
      const defaultTripId = 'home';
      const ms = Array.isArray(data.morningSteps) ? data.morningSteps : [];
      const es = Array.isArray(data.eveningSteps) ? data.eveningSteps : [];
      const products = (data.products && typeof data.products === 'object') ? data.products : {};

      // Make sure products have notes field
      const productsWithNotes = {};
      Object.entries(products).forEach(([k, p]) => {
        productsWithNotes[k] = { ...p, notes: p.notes || '' };
      });

      return {
        version: APP_VERSION,
        products: productsWithNotes,
        trips: {
          [defaultTripId]: {
            id: defaultTripId,
            name: 'ארץ',
            isDefault: true,
            startDate: null,
            endDate: null,
            morningSteps: ms,
            eveningSteps: es,
          }
        },
        tripOrder: [defaultTripId],
        currentTripId: defaultTripId,
        completions: data.completions || {},
        skinJournal: data.skinJournal || {},
        archivedSteps: Array.isArray(data.archivedSteps) ? data.archivedSteps.map(s => ({ ...s, tripId: s.tripId || defaultTripId })) : [],
        dismissedTripBanners: {},
      };
    }

    // ---- v1 -> v3: very old format, just build fresh ----
    const fresh = buildDefaultData();
    if (data.completions) fresh.completions = data.completions;
    if (data.skinJournal) fresh.skinJournal = data.skinJournal;
    return fresh;
  } catch (e) {
    return buildDefaultData();
  }
}

// ============== STORAGE HOOK ==============
function useStorage() {
  const [data, setData] = useState(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return buildDefaultData();
      const parsed = JSON.parse(raw);
      return migrate(parsed);
    } catch (e) {
      return buildDefaultData();
    }
  });

  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
  }, [data]);

  return [data, setData];
}

// ============== STEP / GOAL COUNTERS ==============
// Helper: gather ALL step IDs (across all trips) that reference a given productId
function getStepIdsForProduct(data, productId) {
  const ids = [];
  Object.values(data.trips || {}).forEach(trip => {
    (trip.morningSteps || []).forEach(s => { if (s.productId === productId) ids.push(s.id); });
    (trip.eveningSteps || []).forEach(s => { if (s.productId === productId) ids.push(s.id); });
  });
  return ids;
}

// Helper: gather ALL step IDs (across all trips) that reference any product matching a goal
function getStepIdsForGoal(data, goalId) {
  const productsWithGoal = Object.values(data.products || {}).filter(p => p.goal === goalId).map(p => p.id);
  if (productsWithGoal.length === 0) return [];
  const ids = [];
  Object.values(data.trips || {}).forEach(trip => {
    (trip.morningSteps || []).forEach(s => { if (productsWithGoal.includes(s.productId)) ids.push(s.id); });
    (trip.eveningSteps || []).forEach(s => { if (productsWithGoal.includes(s.productId)) ids.push(s.id); });
  });
  return ids;
}

// Count days the user actually checked off this product, in retrospect.
// slotStartDate acts as a soft floor: counts the earliest of (slotStartDate, earliest matching completion).
// This way retroactive checks are honored.
function countProductDays(data, productId, slotStartDate) {
  if (!productId) return 0;
  const stepIds = getStepIdsForProduct(data, productId);
  if (stepIds.length === 0) return 0;
  const days = new Set();
  Object.entries(data.completions || {}).forEach(([date, c]) => {
    const all = [...(c.morning || []), ...(c.evening || [])];
    if (all.some(id => stepIds.includes(id))) days.add(date);
  });
  return days.size;
}

function countGoalDays(data, goalId, goalStartDate) {
  if (!goalId) return 0;
  const stepIds = getStepIdsForGoal(data, goalId);
  if (stepIds.length === 0) return 0;
  const days = new Set();
  Object.entries(data.completions || {}).forEach(([date, c]) => {
    const all = [...(c.morning || []), ...(c.evening || [])];
    if (all.some(id => stepIds.includes(id))) days.add(date);
  });
  return days.size;
}

// Helper: find a step by ID across all trips (returns { trip, kind, step } or null)
function findStepAcrossTrips(data, stepId) {
  for (const trip of Object.values(data.trips || {})) {
    const m = (trip.morningSteps || []).find(s => s.id === stepId);
    if (m) return { trip, kind: 'morning', step: m };
    const e = (trip.eveningSteps || []).find(s => s.id === stepId);
    if (e) return { trip, kind: 'evening', step: e };
  }
  return null;
}

// ============== STAR RATING ==============
function StarRating({ rating, onChange, size = 'md', readOnly = false }) {
  const sizeClass = size === 'lg' ? 'w-7 h-7' : size === 'sm' ? 'w-3.5 h-3.5' : 'w-5 h-5';
  return (
    <div className="flex gap-1" dir="ltr">
      {[1,2,3,4,5].map(n => (
        <button
          key={n}
          type="button"
          onClick={readOnly ? undefined : () => onChange(n)}
          className={readOnly ? 'cursor-default' : 'transition-transform active:scale-90'}
          aria-label={`${n} כוכבים`}
        >
          <svg viewBox="0 0 24 24" className={`${sizeClass} ${n <= rating ? 'text-amber-400' : 'text-stone-300'}`} fill={n <= rating ? 'currentColor' : 'none'} stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
          </svg>
        </button>
      ))}
    </div>
  );
}

// ============== DAY SELECTOR ==============
function DaySelector({ selected, onChange }) {
  const allOn = selected.length === 7;
  const toggle = (d) => {
    onChange(selected.includes(d) ? selected.filter(x => x !== d) : [...selected, d].sort());
  };
  const toggleAll = () => {
    onChange(allOn ? [] : [0,1,2,3,4,5,6]);
  };
  return (
    <div>
      <div className="flex justify-between items-center mb-2">
        <label className="text-sm font-medium text-stone-700">באילו ימים?</label>
        <button
          type="button"
          onClick={toggleAll}
          className="text-xs px-2.5 py-1 rounded-full bg-stone-100 text-stone-700 hover:bg-stone-200 transition-colors"
        >
          {allOn ? 'נקי הכול' : 'כל יום'}
        </button>
      </div>
      <div className="flex gap-1.5 justify-between" dir="rtl">
        {DAYS_HE.map((d, idx) => {
          const on = selected.includes(idx);
          return (
            <button
              key={idx}
              type="button"
              onClick={() => toggle(idx)}
              className={`day-pill flex-1 py-2 rounded-xl text-sm font-medium border ${
                on
                  ? 'bg-rose-100 border-rose-300 text-rose-800'
                  : 'bg-white border-stone-200 text-stone-500 hover:bg-stone-50'
              }`}
            >
              {d}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ============== FORMAT PRICE / COST PER DAY ==============
function formatPrice(p) {
  if (p === null || p === undefined) return null;
  return `₪${p.toFixed(p % 1 === 0 ? 0 : 2)}`;
}
function formatCostPerDay(price, days) {
  if (!price || !days || days < 1) return null;
  const cpd = price / days;
  return `₪${cpd.toFixed(cpd >= 10 ? 0 : cpd >= 1 ? 1 : 2)} ליום`;
}

    document.body.style.overflow = 'hidden';
    return () => { document.body.style.overflow = original; };
  }, []);
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-card scrollbar-thin" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-xl font-bold text-stone-800 font-serif-he">{title}</h3>
          <button onClick={onClose} className="p-1.5 rounded-full hover:bg-stone-100 transition-colors text-stone-500">
            <Icon name="x" />
          </button>
        </div>
        {children}
      </div>
    </div>
  );
}

// ============== ADD/EDIT STEP DIALOG ==============
function StepDialog({ mode, kind, currentDay, existingSteps, initial, productSuggestions, onClose, onConfirm }) {
  // mode: 'add' | 'edit'
  // kind: 'morning' | 'evening'
  const [name, setName] = useState(initial?.name || '');
  const [productName, setProductName] = useState(initial?.productName || '');
  const [instructions, setInstructions] = useState(initial?.instructions || '');
  const [optional, setOptional] = useState(!!initial?.optional);
  const [days, setDays] = useState(
    initial?.days ?? (kind === 'morning' ? [0,1,2,3,4,5,6] : [currentDay])
  );
  const [position, setPosition] = useState({ kind: 'end', refStepId: null });

  // Product-related fields
  const [goal, setGoal] = useState(initial?.goal ?? null);
  const [goalDays, setGoalDays] = useState(initial?.goalDays ?? null);
  const [price, setPrice] = useState(initial?.price ?? null);
  const [notes, setNotes] = useState(initial?.notes ?? '');

  // Auto-complete state
  // linkedProductId: if user picks a suggestion, this is the product ID to link to (don't create new)
  const [linkedProductId, setLinkedProductId] = useState(initial?.linkedProductId ?? null);
  const [showSuggestions, setShowSuggestions] = useState(false);
  const productNameInputRef = useRef(null);

  // Build filtered suggestions from productName
  const suggestions = useMemo(() => {
    if (!productName.trim() || !productSuggestions || productSuggestions.length === 0) return [];
    const q = productName.trim().toLowerCase();
    // Skip the linked product itself (would be confusing to show what you already picked)
    const matches = productSuggestions.filter(s => {
      if (s.productId && s.productId === linkedProductId) return false;
      return s.name.toLowerCase().includes(q);
    });
    // Sort: exact-prefix first, then substring
    matches.sort((a, b) => {
      const aStarts = a.name.toLowerCase().startsWith(q) ? 0 : 1;
      const bStarts = b.name.toLowerCase().startsWith(q) ? 0 : 1;
      return aStarts - bStarts;
    });
    return matches.slice(0, 6);
  }, [productName, productSuggestions, linkedProductId]);

  const onPickSuggestion = (s) => {
    setProductName(s.name);
    setGoal(s.goal ?? null);
    setGoalDays(s.goalDays ?? null);
    setPrice(s.price ?? null);
    setNotes(s.notes ?? '');
    setLinkedProductId(s.productId || null);
    setShowSuggestions(false);
    // Blur the input so the suggestions don't reappear
    if (productNameInputRef.current) productNameInputRef.current.blur();
  };

  // If user manually changes the productName after picking a suggestion, unlink (they're editing the name)
  const onProductNameChange = (val) => {
    setProductName(val);
    if (linkedProductId) {
      // If they edit it, treat as wanting to create new / re-search
      setLinkedProductId(null);
    }
    setShowSuggestions(true);
  };

  const canSubmit = name.trim() && days.length > 0;

  return (
    <Modal title={mode === 'add' ? `הוספת שלב ${kind === 'morning' ? 'בוקר' : 'ערב'}` : 'עריכת שלב'} onClose={onClose}>
      <div className="space-y-4">
        <div>
          <label className="block text-sm font-medium text-stone-700 mb-2">שם השלב</label>
          <input
            type="text"
            value={name}
            onChange={(e) => setName(e.target.value)}
            placeholder="למשל: סרום ויטמין C"
            className="w-full p-3 border border-stone-200 rounded-2xl text-sm bg-stone-50/50 focus:outline-none focus:border-rose-300"
            style={{ fontFamily: "'Heebo', sans-serif" }}
            autoFocus
          />
        </div>

        <div className="relative">
          <label className="block text-sm font-medium text-stone-700 mb-2">
            שם המוצר (אופציונלי)
            {linkedProductId && (
              <span className="text-[10px] mr-2 px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 border border-emerald-200">
                מחובר למוצר קיים
              </span>
            )}
          </label>
          <input
            ref={productNameInputRef}
            type="text"
            value={productName}
            onChange={(e) => onProductNameChange(e.target.value)}
            onFocus={() => setShowSuggestions(true)}
            onBlur={() => setTimeout(() => setShowSuggestions(false), 180)}
            placeholder="למשל: The Ordinary Niacinamide"
            className="w-full p-3 border border-stone-200 rounded-2xl text-sm bg-stone-50/50 focus:outline-none focus:border-rose-300"
            style={{ fontFamily: "'Heebo', sans-serif" }}
          />

          {showSuggestions && suggestions.length > 0 && (
            <div className="absolute z-20 left-0 right-0 top-full mt-1 bg-white rounded-2xl shadow-xl border border-stone-200 overflow-hidden anim-fade-in">
              <div className="px-3 py-1.5 text-[10px] text-stone-400 bg-stone-50 border-b border-stone-100">
                ✨ השלמה אוטומטית · לחיצה תמלא את כל הפרטים
              </div>
              {suggestions.map((s, idx) => (
                <button
                  key={s.key + '-' + idx}
                  type="button"
                  onMouseDown={(e) => e.preventDefault()}
                  onClick={() => onPickSuggestion(s)}
                  className="w-full text-right p-3 hover:bg-emerald-50 transition-colors flex items-start gap-2 border-b border-stone-100 last:border-0"
                >
                  <div className="flex-1 min-w-0">
                    <div className="font-medium text-stone-800 text-sm">{s.name}</div>
                    <div className="flex items-center flex-wrap gap-1.5 mt-0.5 text-[11px]">
                      {s.goal && (
                        <span className="text-emerald-700">{goalById(s.goal)?.label}</span>
                      )}
                      {s.archived && (
                        <span className="text-amber-700">· מהארכיון</span>
                      )}
                      {s.price && (
                        <span className="text-stone-500">· {formatPrice(s.price)}</span>
                      )}
                    </div>
                  </div>
                </button>
              ))}
            </div>
          )}

          {mode === 'edit' && initial?.productName && (
            <p className="text-xs text-stone-500 mt-1.5 leading-relaxed">
              💡 לתיקון איות / שינוי שם בלבד. אם <strong>נגמר</strong> ואת מחליפה למותג אחר - השתמשי ב<strong>"החליפי מוצר"</strong> במקום (כדי לשמור את ההיסטוריה והדירוג).
            </p>
          )}
        </div>

        {productName.trim() && (
          <>
            <GoalFields
              goal={goal}
              goalDays={goalDays}
              onGoalChange={setGoal}
              onGoalDaysChange={setGoalDays}
            />
            <PriceField price={price} onChange={setPrice} />
            <ProductNotesField notes={notes} onChange={setNotes} />
          </>
        )}

        <div>
          <label className="block text-sm font-medium text-stone-700 mb-2">פירוט - הוראות שימוש (אופציונלי)</label>
          <textarea
            value={instructions}
            onChange={(e) => setInstructions(e.target.value)}
            placeholder="למשל: מסה עדינה ל-30 שניות"
            className="w-full p-3 border border-stone-200 rounded-2xl text-sm resize-none bg-stone-50/50 focus:outline-none focus:border-rose-300"
            rows={2}
            style={{ fontFamily: "'Heebo', sans-serif" }}
          />
        </div>

        <DaySelector selected={days} onChange={setDays} />

        {mode === 'add' && existingSteps.length > 0 && (
          <PositionPicker steps={existingSteps} position={position} onChange={setPosition} />
        )}

        <label className="flex items-center gap-2 cursor-pointer p-2 rounded-xl hover:bg-stone-50">
          <input
            type="checkbox"
            checked={optional}
            onChange={(e) => setOptional(e.target.checked)}
            className="w-4 h-4 accent-amber-500"
          />
          <span className="text-sm text-stone-700">סמני כשלב <strong>אופציונלי</strong></span>
          <span className="text-xs text-stone-500">(לא ייספר בהשלמה היומית)</span>
        </label>

        <div className="flex gap-2 pt-2">
          <button onClick={onClose} className="flex-1 py-3 rounded-2xl bg-stone-100 text-stone-700 font-medium hover:bg-stone-200 transition-colors">
            ביטול
          </button>
          <button
            onClick={() => canSubmit && onConfirm({
              name: name.trim(),
              productName: productName.trim(),
              instructions: instructions.trim(),
              optional,
              days,
              position,
              goal,
              goalDays,
              price,
              notes: notes.trim(),
              linkedProductId,
            })}
            disabled={!canSubmit}
            className={`flex-1 py-3 rounded-2xl font-medium transition-all ${
              canSubmit ? 'bg-rose-500 text-white hover:bg-rose-600 shadow-sm active:scale-[0.98]' : 'bg-stone-200 text-stone-400 cursor-not-allowed'
            }`}
          >
            {mode === 'add' ? 'הוסיפי שלב' : 'שמרי שינויים'}
          </button>
        </div>
      </div>
    </Modal>
  );
}

  const [name, setName] = useState(product?.name || '');
  const [goal, setGoal] = useState(product?.goal ?? null);
  const [goalDays, setGoalDays] = useState(product?.goalDays ?? null);

// ============== SKIN JOURNAL SECTION ==============
function SkinJournalSection({ dateKey, entry, onToggleTag, onUpdateNote, onSave }) {
  const [localNote, setLocalNote] = useState(entry.note || '');
  const [justSaved, setJustSaved] = useState(false);
  const [dirty, setDirty] = useState(false);
  const debounceRef = useRef(null);

  useEffect(() => {
    setLocalNote(entry.note || '');
    setDirty(false);
    setJustSaved(false);
  }, [dateKey]);

  // Debounced auto-save in background (so data never lost)
  useEffect(() => {
    if (localNote === (entry.note || '')) return;
    setDirty(true);
    if (debounceRef.current) clearTimeout(debounceRef.current);
    debounceRef.current = setTimeout(() => onUpdateNote(localNote), 500);
    return () => { if (debounceRef.current) clearTimeout(debounceRef.current); };
  }, [localNote]);

  const tags = entry.tags || [];

  const handleSave = () => {
    if (debounceRef.current) clearTimeout(debounceRef.current);
    onUpdateNote(localNote);
    onSave();
    setJustSaved(true);
    setDirty(false);
    setTimeout(() => setJustSaved(false), 2000);
  };

  return (
    <div className="bg-white/80 backdrop-blur-sm rounded-3xl p-5 mb-4 shadow-sm border border-stone-200/40">
      <div className="flex items-center gap-3 mb-3">
        <div className="bg-emerald-100 text-emerald-700 p-2 rounded-full">
          <Icon name="book" className="w-5 h-5" />
        </div>
        <div>
          <h2 className="text-xl font-bold text-stone-800 font-serif-he">יומן עור</h2>
          <p className="text-xs text-stone-500">איך העור הרגיש היום?</p>
        </div>
      </div>

      <div className="flex flex-wrap gap-2 mb-3">
        {SKIN_TAGS.map(tag => {
          const active = tags.includes(tag.id);
          return (
            <button
              key={tag.id}
              onClick={() => { onToggleTag(tag.id); setDirty(true); setJustSaved(false); }}
              className={`text-sm px-3 py-1.5 rounded-full border transition-all active:scale-95 ${
                active ? `${tag.color} font-medium` : 'bg-white text-stone-500 border-stone-200 hover:bg-stone-50'
              }`}
            >
              {tag.label}
            </button>
          );
        })}
      </div>

      <textarea
        value={localNote}
        onChange={(e) => setLocalNote(e.target.value)}
        placeholder="הערות על העור היום..."
        className="w-full p-3 border border-stone-200 rounded-2xl text-sm resize-none bg-stone-50/50 focus:outline-none focus:border-emerald-300 mb-3"
        rows={3}
        style={{ fontFamily: "'Heebo', sans-serif" }}
      />

      <button
        onClick={handleSave}
        disabled={justSaved}
        className={`w-full py-3 rounded-2xl font-medium transition-all ${
          justSaved
            ? 'bg-stone-100 text-stone-500'
            : 'bg-emerald-500 text-white hover:bg-emerald-600 shadow-sm active:scale-[0.98]'
        }`}
      >
        {justSaved ? '✓ נשמר' : (entry.savedAt && !dirty ? 'עדכני רישום' : 'שמרי רישום יומי')}
      </button>
    </div>
  );
}

function ArchivePanel({ data, onClose, onRestoreStep, onDeletePermanent, onExport, onImport }) {

    Object.values(data.products).forEach(p => {
      (p.history || []).forEach(h => list.push({ ...h, slotName: p.name }));
    });
    return list.sort((a, b) => (b.endDate || '').localeCompare(a.endDate || ''));
  }, [data.products]);

  return (
    <Modal title="ארכיון" onClose={onClose}>
      <div className="space-y-4">
        <div className="flex gap-1 bg-stone-100 p-1 rounded-2xl">
          <button
            onClick={() => setTab('products')}
            className={`flex-1 py-2 rounded-xl text-sm font-medium transition-all ${
              tab === 'products' ? 'bg-white shadow-sm text-stone-800' : 'text-stone-500'
            }`}
          >
            מוצרים שהוחלפו
          </button>
          <button
            onClick={() => setTab('steps')}
            className={`flex-1 py-2 rounded-xl text-sm font-medium transition-all ${
              tab === 'steps' ? 'bg-white shadow-sm text-stone-800' : 'text-stone-500'
            }`}
          >
            צעדים שהוסרו
          </button>
          <button
            onClick={() => setTab('backup')}
            className={`flex-1 py-2 rounded-xl text-sm font-medium transition-all ${
              tab === 'backup' ? 'bg-white shadow-sm text-stone-800' : 'text-stone-500'
            }`}
          >
            גיבוי
          </button>
        </div>

        {tab === 'products' && (
          <div className="space-y-2 max-h-[55vh] overflow-y-auto scrollbar-thin">
            {replacedProducts.length === 0 ? (
              <div className="text-center py-8 text-stone-500 text-sm">
                עדיין לא הוחלפו מוצרים. כשתחליפי מוצר, ההיסטוריה תופיע כאן 🌸
              </div>

              const priceStr = formatPrice(h.price);
              const cpdStr = formatCostPerDay(h.price, h.daysUsed);
              return (
                <div key={idx} className="bg-white rounded-2xl p-3 border border-stone-200/60">
                  <div className="flex items-start justify-between gap-2">
                    <div className="flex-1 min-w-0">
                      <div className="font-semibold text-stone-800">{h.name}</div>
                      <div className="text-xs text-stone-500 mt-0.5">
                        בתפקיד: {h.slotName} {h.goal ? `· ${goalById(h.goal)?.label || ''}` : ''}
                      </div>
                    </div>
                    <StarRating rating={h.rating || 0} onChange={() => {}} size="sm" readOnly />
                  </div>
                  <div className="flex items-center flex-wrap gap-x-3 gap-y-1 mt-2 text-[11px] text-stone-500">
                    {h.startDate && <span>מ-{formatDate(h.startDate)}</span>}
                    {h.endDate && <span>עד {formatDate(h.endDate)}</span>}
                    {h.daysUsed !== undefined && (
                      <span className="font-medium text-stone-600">
                        {h.daysUsed}{h.goalDays ? `/${h.goalDays}` : ''} {h.daysUsed === 1 ? 'יום' : 'ימים'}
                      </span>
                    )}
                    {priceStr && (
                      <span className="font-medium text-stone-600">
                        · {priceStr}{cpdStr ? ` (${cpdStr})` : ''}
                      </span>
                    )}
                  </div>
                  {h.note && (
                    <div className="text-xs text-stone-600 mt-2 bg-stone-50 rounded-xl p-2 italic">"{h.note}"</div>
                  )}
                </div>
              );
            })}
          </div>
        )}

        {tab === 'steps' && (
          <div className="space-y-2 max-h-[55vh] overflow-y-auto scrollbar-thin">
            {data.archivedSteps.length === 0 ? (
              <div className="text-center py-8 text-stone-500 text-sm">
                עדיין לא הוסרו צעדים מהשגרה.
              </div>
            ) : data.archivedSteps.map((s) => (
              <ArchivedStepRow key={s.id} step={s} products={data.products} onRestore={() => onRestoreStep(s.id)} onDelete={() => onDeletePermanent(s.id)} />
            ))}
          </div>
        )}

        {tab === 'backup' && (
          <div className="space-y-3">
            <div className="bg-stone-50 rounded-2xl p-3 text-xs text-stone-600 leading-relaxed">
              💾 הנתונים שלך נשמרים אוטומטית בדפדפן. כדי שלא יאבדו אם משהו ישתבש, מומלץ להוריד גיבוי מדי פעם.

                accept="application/json,.json"
                className="hidden"

                  const f = e.target.files?.[0];
                  if (f) {
                    const reader = new FileReader();
                    reader.onload = () => {
                      try {
                        const parsed = JSON.parse(reader.result);
                        onImport(parsed);
                      } catch (err) {
                        alert('הקובץ לא תקין. ודאי שזה קובץ JSON שיוצא מהאפליקציה.');
                      }
                    };
                    reader.readAsText(f);
                  }
                  e.target.value = '';
                }}
              />
              <span className="block w-full py-3 rounded-2xl bg-stone-100 text-stone-700 font-medium hover:bg-stone-200 cursor-pointer transition-all flex items-center justify-center gap-2">

            <div className="text-[11px] text-stone-500 text-center leading-relaxed">

            </div>
          </div>
        )}
      </div>
    </Modal>
  );
}

// ============== ROUTINE SECTION ==============
function RoutineSection({ kind, steps, products, completions, currentDay, dateKey, allData,
                         onToggleStep, isCollapsed, onToggleCollapse,
                         onAddStep, onEditStep, onEditProduct, onReplaceProduct, onMoveStep, onArchiveStep,
                         openMenuId, onOpenMenu }) {
  const isMorning = kind === 'morning';
  const dayKey = isMorning ? 'morning' : 'evening';
  const checkedIds = new Set(completions[dayKey] || []);

  // Steps active for currentDay
  const activeSteps = steps.filter(s => s.days.includes(currentDay));

  // Required vs optional
  const requiredSteps = activeSteps.filter(s => !s.optional);
  const optionalSteps = activeSteps.filter(s => s.optional);

  const requiredDone = requiredSteps.filter(s => checkedIds.has(s.id)).length;
  const optionalDone = optionalSteps.filter(s => checkedIds.has(s.id)).length;

  const allRequiredDone = requiredSteps.length > 0 && requiredDone === requiredSteps.length;

  const sectionColor = isMorning
    ? { bg: 'bg-amber-100', text: 'text-amber-800', accent: 'text-amber-700' }
    : { bg: 'bg-indigo-100', text: 'text-indigo-800', accent: 'text-indigo-700' };

  return (
    <div className={`bg-white/80 backdrop-blur-sm rounded-3xl shadow-sm border border-stone-200/40 mb-4 overflow-hidden ${
      allRequiredDone && isMorning ? 'ring-1 ring-emerald-200' : ''
    }`}>
      <button
        onClick={onToggleCollapse}
        className="w-full flex items-center justify-between p-5"
      >
        <div className="flex items-center gap-3">
          <div className={`${sectionColor.bg} ${sectionColor.text} p-2 rounded-full`}>
            <Icon name={isMorning ? 'sun' : 'moon'} className="w-5 h-5" />
          </div>
          <div className="text-right">
            <h2 className="text-xl font-bold text-stone-800 font-serif-he">{isMorning ? 'בוקר' : 'ערב'}</h2>
            <div className="text-xs text-stone-500">
              {requiredSteps.length === 0 ? (
                <span>אין צעדים נדרשים ל{DAYS_FULL_HE[currentDay]}</span>
              ) : (
                <>
                  <span className={allRequiredDone ? 'text-emerald-700 font-medium' : ''}>
                    {requiredDone}/{requiredSteps.length}
                  </span>
                  {optionalSteps.length > 0 && optionalDone > 0 && (
                    <span className="text-stone-400 mr-1">+{optionalDone}</span>
                  )}
                  {allRequiredDone && (
                    <span className="mr-2 text-emerald-700 font-medium">· הושלם 🌸</span>
                  )}
                </>
              )}
            </div>
          </div>
        </div>
        <Icon name={isCollapsed ? 'chevronDown' : 'chevronUp'} className="w-5 h-5 text-stone-400" />
      </button>

      <div className="collapse-section" style={{
        maxHeight: isCollapsed ? 0 : 5000,
        opacity: isCollapsed ? 0 : 1,
      }}>
        <div className="px-4 pb-4">
          {activeSteps.length === 0 && (
            <div className="text-center py-6 text-sm text-stone-500">
              אין שלבים ל{DAYS_FULL_HE[currentDay]} ב{isMorning ? 'בוקר' : 'ערב'}
            </div>
          )}
          {activeSteps.map((step, idx) => {
            const product = step.productId ? products[step.productId] : null;
            // Move arrows: position within all steps (regardless of day filter)
            const fullIdx = steps.findIndex(s => s.id === step.id);
            return (
              <StepRow
                key={step.id}
                step={step}
                product={product}
                isChecked={checkedIds.has(step.id)}
                onToggle={() => onToggleStep(step.id)}
                onOpenActions={() => onOpenMenu(step.id)}
                onEdit={() => onEditStep(step)}
                onEditProduct={product ? () => onEditProduct(step) : null}
                onReplace={product ? () => onReplaceProduct(step) : null}
                onMoveUp={fullIdx > 0 ? () => onMoveStep(step.id, -1) : null}
                onMoveDown={fullIdx < steps.length - 1 ? () => onMoveStep(step.id, 1) : null}
                onArchive={() => onArchiveStep(step)}
                allData={allData}
              />
            );
          })}
          <button
            onClick={onAddStep}
            className="w-full mt-2 py-3 rounded-2xl border-2 border-dashed border-stone-300 text-stone-500 hover:bg-stone-50 hover:text-rose-600 hover:border-rose-300 transition-all flex items-center justify-center gap-2 text-sm"
          >
            <Icon name="plus" className="w-4 h-4" />
            הוסיפי שלב ל{isMorning ? 'בוקר' : 'ערב'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ============== TRIP BANNER (date-based reminder) ==============
function TripBanner({ activeTrip, scheduledTrip, currentTripId, onSwitch, onDismiss }) {
  // Two scenarios:
  // 1. scheduledTrip = a trip whose startDate is today AND it's not currently active → suggest switching IN
  // 2. activeTrip = a trip whose endDate is today AND it IS the current trip → suggest switching OUT (back to default)
  if (scheduledTrip && scheduledTrip.id !== currentTripId) {
    return (
      <div className="bg-rose-50 border border-rose-200 rounded-3xl p-4 mb-3 anim-fade-in">
        <div className="flex items-start gap-3">
          <div className="flex-1 min-w-0">
            <div className="text-sm text-stone-700 leading-relaxed">
              🎒 היום מתחיל ה-Trip <strong>"{scheduledTrip.name}"</strong>. להחליף את השגרה?
            </div>
          </div>
        </div>
        <div className="flex gap-2 mt-3">
          <button
            onClick={() => onSwitch(scheduledTrip.id)}
            className="flex-1 py-2 rounded-2xl bg-rose-500 text-white text-sm font-medium hover:bg-rose-600 transition-colors"
          >
            כן, החליפי
          </button>
          <button
            onClick={() => onDismiss(`${scheduledTrip.id}-start`)}
            className="px-4 py-2 rounded-2xl bg-stone-100 text-stone-600 text-sm hover:bg-stone-200"
          >
            לא עכשיו
          </button>
        </div>
      </div>
    );
  }
  if (activeTrip) {
    return (
      <div className="bg-amber-50 border border-amber-200 rounded-3xl p-4 mb-3 anim-fade-in">
        <div className="text-sm text-stone-700 leading-relaxed">
          🏠 היום מסתיים ה-Trip <strong>"{activeTrip.name}"</strong>. לחזור לשגרה הרגילה?
        </div>
        <div className="flex gap-2 mt-3">
          <button
            onClick={() => onSwitch(activeTrip.defaultId)}
            className="flex-1 py-2 rounded-2xl bg-amber-500 text-white text-sm font-medium hover:bg-amber-600 transition-colors"
          >
            כן, חזרי
          </button>
          <button
            onClick={() => onDismiss(`${activeTrip.id}-end`)}
            className="px-4 py-2 rounded-2xl bg-stone-100 text-stone-600 text-sm hover:bg-stone-200"
          >
            לא עכשיו
          </button>
        </div>
      </div>
    );
  }
  return null;
}

// ============== WEEK STRIP ==============
function WeekStrip({ dateKey, onChangeDate, completions, morningSteps, eveningSteps }) {
  // Find the start of week (Sunday)
  const [y,m,d] = dateKey.split('-').map(Number);
  const baseDate = new Date(y, m-1, d);
  const weekday = baseDate.getDay();
  const sunday = new Date(baseDate);
  sunday.setDate(sunday.getDate() - weekday);
  const days = Array.from({ length: 7 }, (_, i) => {
    const dt = new Date(sunday);
    dt.setDate(sunday.getDate() + i);
    return todayKey(dt);
  });
  const todayK = todayKey();

  return (
    <div className="bg-white/70 backdrop-blur-sm rounded-3xl p-3 mb-4 shadow-sm border border-stone-200/40">
      <div className="flex items-center justify-between mb-2 px-1">
        <button
          onClick={() => onChangeDate(addDaysKey(dateKey, -7))}
          className="p-1.5 rounded-full hover:bg-stone-100 text-stone-500"
          aria-label="שבוע קודם"
        >
          <Icon name="chevronRight" className="w-4 h-4" />
        </button>
        <button
          onClick={() => onChangeDate(todayK)}
          className="text-xs px-3 py-1 rounded-full bg-stone-100 text-stone-700 hover:bg-stone-200"
        >
          היום
        </button>
        <button
          onClick={() => onChangeDate(addDaysKey(dateKey, 7))}
          className="p-1.5 rounded-full hover:bg-stone-100 text-stone-500"
          aria-label="שבוע הבא"
        >
          <Icon name="chevronLeft" className="w-4 h-4" />
        </button>
      </div>
      <div className="flex gap-1.5 justify-between" dir="rtl">
        {days.map((dk, idx) => {
          const isSelected = dk === dateKey;
          const isToday = dk === todayK;
          const wd = idx; // 0..6 Sunday..Saturday
          const c = completions[dk] || {};
          const morningActive = morningSteps.filter(s => !s.optional && s.days.includes(wd));
          const eveningActive = eveningSteps.filter(s => !s.optional && s.days.includes(wd));
          const morningDone = morningActive.length > 0 && morningActive.every(s => (c.morning || []).includes(s.id));
          const eveningDone = eveningActive.length > 0 && eveningActive.every(s => (c.evening || []).includes(s.id));

          const dayNum = dk.split('-')[2];
          return (
            <button
              key={dk}
              onClick={() => onChangeDate(dk)}
              className={`flex-1 py-2 rounded-2xl flex flex-col items-center transition-all ${
                isSelected ? 'bg-rose-500 text-white shadow-sm' : isToday ? 'bg-rose-100 text-rose-800' : 'hover:bg-stone-100 text-stone-600'
              }`}
            >
              <span className={`text-[10px] ${isSelected ? 'text-rose-100' : 'text-stone-500'}`}>{DAYS_HE[idx]}</span>
              <span className="text-sm font-semibold">{Number(dayNum)}</span>
              <div className="flex gap-0.5 mt-1 h-1">
                <div className={`w-1.5 h-1 rounded-full ${morningDone ? (isSelected ? 'bg-white' : 'bg-amber-400') : 'bg-stone-300/50'}`}></div>
                <div className={`w-1.5 h-1 rounded-full ${eveningDone ? (isSelected ? 'bg-white' : 'bg-indigo-400') : 'bg-stone-300/50'}`}></div>
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ============== MAIN APP ==============
function App() {
  const [data, setData] = useStorage();
  const [dateKey, setDateKey] = useState(() => todayKey());
  const [openMenuId, setOpenMenuId] = useState(null);

  // Dialog state
  const [addStepKind, setAddStepKind] = useState(null); // 'morning' | 'evening' | null
  const [editStep, setEditStep] = useState(null);       // { kind, step }
  const [editProduct, setEditProduct] = useState(null); // { product } (legacy - not used in new UI but kept to not break refs)
  const [replaceProduct, setReplaceProduct] = useState(null); // { product }
  const [showArchive, setShowArchive] = useState(false);
  const [showTripManager, setShowTripManager] = useState(false);

  const [morningCollapsed, setMorningCollapsed] = useState(false);
  const [autoCollapsedKey, setAutoCollapsedKey] = useState(null);

  const currentDay = useMemo(() => weekdayOf(dateKey), [dateKey]);

  // Current trip
  const currentTrip = data.trips?.[data.currentTripId] || data.trips?.[data.tripOrder?.[0]];
  const morningSteps = currentTrip?.morningSteps || [];
  const eveningSteps = currentTrip?.eveningSteps || [];

  // Build product suggestions from current products + history entries (for autocomplete)
  const productSuggestions = useMemo(() => {
    const list = [];
    const seenNames = new Set(); // to avoid showing duplicates with the same display name
    // Active products first
    Object.values(data.products || {}).forEach(p => {
      const key = `live-${p.id}`;
      list.push({
        key,
        name: p.name,
        goal: p.goal,
        goalDays: p.goalDays,
        price: p.price,
        notes: p.notes || '',
        productId: p.id,
        archived: false,
      });
      seenNames.add(p.name.trim().toLowerCase() + '|' + (p.goal || ''));
    });
    // Archived (history) entries
    Object.values(data.products || {}).forEach(p => {
      (p.history || []).forEach((h, idx) => {
        const sig = (h.name || '').trim().toLowerCase() + '|' + (h.goal || '');
        if (seenNames.has(sig)) return;
        seenNames.add(sig);
        list.push({
          key: `hist-${p.id}-${idx}`,
          name: h.name,
          goal: h.goal,
          goalDays: h.goalDays,
          price: h.price,
          notes: '', // history doesn't carry notes
          productId: null, // no link - creates new product if picked
          archived: true,
        });
      });
    });
    return list;
  }, [data.products]);

  // Auto-collapse morning when all required morning steps are done
  useEffect(() => {
    const c = data.completions[dateKey] || {};
    const morningChecked = new Set(c.morning || []);
    const requiredMorning = morningSteps.filter(s => !s.optional && s.days.includes(currentDay));
    const allDone = requiredMorning.length > 0 && requiredMorning.every(s => morningChecked.has(s.id));
    if (allDone && autoCollapsedKey !== dateKey) {
      setMorningCollapsed(true);
      setAutoCollapsedKey(dateKey);
    }
  }, [data.completions, dateKey, currentDay, morningSteps]);

  // When date changes, reset collapse to open
  useEffect(() => {
    setMorningCollapsed(false);
    setAutoCollapsedKey(null);
  }, [dateKey]);

  // ============== ACTIONS ==============
  const toggleStep = (kind, stepId) => {
    setData(prev => {
      const c = prev.completions[dateKey] || { morning: [], evening: [] };
      const arr = c[kind] || [];
      const next = arr.includes(stepId) ? arr.filter(x => x !== stepId) : [...arr, stepId];
      return {
        ...prev,
        completions: { ...prev.completions, [dateKey]: { ...c, [kind]: next } }
      };
    });
  };

  const handleAddStep = (kind, payload) => {
    setData(prev => {
      const next = { ...prev };
      const today = todayKey();
      const tripId = next.currentTripId;
      if (!tripId || !next.trips[tripId]) return prev;

      // Decide product handling
      let productId = null;
      if (payload.linkedProductId && next.products[payload.linkedProductId]) {
        // Link to existing product
        productId = payload.linkedProductId;
        // Optionally update price/notes if the user changed them in the dialog
        const existing = next.products[productId];
        next.products = {
          ...next.products,
          [productId]: {
            ...existing,
            // We don't overwrite name/goal/goalDays from autocomplete pick; only update price/notes if user changed
            price: payload.price ?? existing.price,
            notes: payload.notes || existing.notes || '',
          }
        };
      } else if (payload.productName) {
        // Create new product
        productId = uid();
        const existingWithGoal = payload.goal
          ? Object.values(next.products).find(p => p.goal === payload.goal)
          : null;
        next.products = {
          ...next.products,
          [productId]: {
            id: productId,
            name: payload.productName,
            goal: payload.goal || null,
            goalDays: payload.goalDays ?? null,
            price: payload.price ?? null,
            notes: payload.notes || '',
            slotStartDate: today,
            goalStartDate: existingWithGoal ? existingWithGoal.goalStartDate : today,
            history: [],
          }
        };
      }

      const newStep = {
        id: uid(),
        name: payload.name,
        productId,
        optional: payload.optional,
        instructions: payload.instructions,
        days: payload.days,
      };

      const stepsKey = kind === 'morning' ? 'morningSteps' : 'eveningSteps';
      const trip = next.trips[tripId];
      const list = [...(trip[stepsKey] || [])];
      let insertAt = list.length;
      if (payload.position?.kind === 'start') insertAt = 0;
      else if (payload.position?.kind === 'after' && payload.position.refStepId) {
        const i = list.findIndex(s => s.id === payload.position.refStepId);
        if (i >= 0) insertAt = i + 1;
      } else if (payload.position?.kind === 'before' && payload.position.refStepId) {
        const i = list.findIndex(s => s.id === payload.position.refStepId);
        if (i >= 0) insertAt = i;
      }
      list.splice(insertAt, 0, newStep);
      next.trips = {
        ...next.trips,
        [tripId]: { ...trip, [stepsKey]: list }
      };

      return next;
    });
    setAddStepKind(null);
  };

  const handleEditStep = (kind, originalStep, payload) => {
    setData(prev => {
      const next = { ...prev };
      const today = todayKey();
      const tripId = next.currentTripId;
      if (!tripId || !next.trips[tripId]) return prev;
      const stepsKey = kind === 'morning' ? 'morningSteps' : 'eveningSteps';

      const oldProductId = originalStep.productId;
      const oldProduct = oldProductId ? next.products[oldProductId] : null;
      const newProductName = payload.productName;
      const hadProduct = !!oldProductId;
      const wantsProduct = !!newProductName;

      let updatedProductId = oldProductId;

      // If user picked autocomplete suggestion linking to a different existing product
      if (payload.linkedProductId && next.products[payload.linkedProductId] && payload.linkedProductId !== oldProductId) {
        // Switch to linked product
        updatedProductId = payload.linkedProductId;
        // Update its price/notes if user edited them
        const linked = next.products[payload.linkedProductId];
        next.products = {
          ...next.products,
          [payload.linkedProductId]: {
            ...linked,
            price: payload.price ?? linked.price,
            notes: payload.notes || linked.notes || '',
          }
        };
      } else if (!hadProduct && wantsProduct) {
        // Create new product
        const newId = uid();
        const existingWithGoal = payload.goal
          ? Object.values(next.products).find(p => p.goal === payload.goal)
          : null;
        next.products = {
          ...next.products,
          [newId]: {
            id: newId,
            name: newProductName,
            goal: payload.goal || null,
            goalDays: payload.goalDays ?? null,
            price: payload.price ?? null,
            notes: payload.notes || '',
            slotStartDate: today,
            goalStartDate: existingWithGoal ? existingWithGoal.goalStartDate : (payload.goal ? today : null),
            history: [],
          }
        };
        updatedProductId = newId;
      } else if (hadProduct && !wantsProduct) {
        // Unlink product
        updatedProductId = null;
      } else if (hadProduct && wantsProduct) {
        // Update existing product
        const goalChanged = oldProduct.goal !== payload.goal;
        let newGoalStartDate = oldProduct.goalStartDate;
        if (goalChanged) {
          const otherWithGoal = payload.goal
            ? Object.values(next.products).find(p => p.id !== oldProductId && p.goal === payload.goal)
            : null;
          newGoalStartDate = otherWithGoal ? otherWithGoal.goalStartDate : (payload.goal ? today : null);
        }
        next.products = {
          ...next.products,
          [oldProductId]: {
            ...oldProduct,
            name: newProductName,
            goal: payload.goal || null,
            goalDays: payload.goalDays ?? null,
            price: payload.price ?? null,
            notes: payload.notes || '',
            goalStartDate: newGoalStartDate,
          }
        };
      }

      // Update the step inside the current trip
      const trip = next.trips[tripId];
      next.trips = {
        ...next.trips,
        [tripId]: {
          ...trip,
          [stepsKey]: (trip[stepsKey] || []).map(s => s.id === originalStep.id ? {
            ...s,
            name: payload.name,
            instructions: payload.instructions,
            optional: payload.optional,
            days: payload.days,
            productId: updatedProductId,
          } : s)
        }
      };

      return next;
    });
    setEditStep(null);
  };

  const handleEditProduct = (product, payload) => {
    setData(prev => {
      const next = { ...prev };
      const today = todayKey();
      const existing = next.products[product.id];
      const goalChanged = existing.goal !== payload.goal;

      let newGoalStartDate = existing.goalStartDate;
      if (goalChanged) {
        // If switching to a goal already used elsewhere — continue from there
        const otherWithGoal = payload.goal
          ? Object.values(next.products).find(p => p.id !== product.id && p.goal === payload.goal)
          : null;
        newGoalStartDate = otherWithGoal ? otherWithGoal.goalStartDate : (payload.goal ? today : null);
      }

      next.products = {
        ...next.products,
        [product.id]: {
          ...existing,
          name: payload.name,
          goal: payload.goal,
          goalDays: payload.goalDays,
          goalStartDate: newGoalStartDate,
        }
      };
      return next;
    });
    setEditProduct(null);
  };

  const handleReplaceProduct = (product, payload) => {
    setData(prev => {
      const next = { ...prev };
      const today = todayKey();
      const existing = next.products[product.id];
      const daysUsed = countProductDays(next, product.id, existing.slotStartDate);

      const historyEntry = {
        name: existing.name,
        rating: payload.rating,
        note: payload.note,
        goal: existing.goal,
        goalDays: existing.goalDays,
        price: existing.price ?? null,
        startDate: existing.slotStartDate,
        endDate: today,
        daysUsed,
      };

      const sameGoal = existing.goal && existing.goal === payload.newGoal;
      const otherWithGoal = payload.newGoal
        ? Object.values(next.products).find(p => p.id !== product.id && p.goal === payload.newGoal)
        : null;
      let newGoalStartDate;
      if (sameGoal) newGoalStartDate = existing.goalStartDate;
      else if (otherWithGoal) newGoalStartDate = otherWithGoal.goalStartDate;
      else if (payload.newGoal) newGoalStartDate = today;
      else newGoalStartDate = null;

      next.products = {
        ...next.products,
        [product.id]: {
          ...existing,
          name: payload.newName,
          goal: payload.newGoal,
          goalDays: payload.newGoalDays,
          price: payload.newPrice ?? null,
          notes: payload.newNotes || '',
          slotStartDate: today,
          goalStartDate: newGoalStartDate,
          history: [...(existing.history || []), historyEntry],
        }
      };
      return next;
    });
    setReplaceProduct(null);
  };

  const handleMoveStep = (kind, stepId, delta) => {
    setData(prev => {
      const next = { ...prev };
      const tripId = next.currentTripId;
      if (!tripId || !next.trips[tripId]) return prev;
      const stepsKey = kind === 'morning' ? 'morningSteps' : 'eveningSteps';
      const trip = next.trips[tripId];
      const list = [...(trip[stepsKey] || [])];
      const i = list.findIndex(s => s.id === stepId);
      if (i < 0) return prev;
      const j = i + delta;
      if (j < 0 || j >= list.length) return prev;
      [list[i], list[j]] = [list[j], list[i]];
      next.trips = { ...next.trips, [tripId]: { ...trip, [stepsKey]: list } };
      return next;
    });
  };

  const handleArchiveStep = (kind, step) => {
    setData(prev => {
      const next = { ...prev };
      const tripId = next.currentTripId;
      if (!tripId || !next.trips[tripId]) return prev;
      const stepsKey = kind === 'morning' ? 'morningSteps' : 'eveningSteps';
      const trip = next.trips[tripId];
      next.trips = {
        ...next.trips,
        [tripId]: {
          ...trip,
          [stepsKey]: (trip[stepsKey] || []).filter(s => s.id !== step.id),
        }
      };
      next.archivedSteps = [...(next.archivedSteps || []), { ...step, type: kind, archivedAt: todayKey(), tripId }];
      return next;
    });
  };

  const handleRestoreStep = (stepId) => {
    setData(prev => {
      const next = { ...prev };
      const archived = (next.archivedSteps || []).find(s => s.id === stepId);
      if (!archived) return prev;
      next.archivedSteps = next.archivedSteps.filter(s => s.id !== stepId);
      // Restore into the trip it came from, or current trip if that trip is gone
      const targetTripId = (archived.tripId && next.trips[archived.tripId]) ? archived.tripId : next.currentTripId;
      if (!targetTripId || !next.trips[targetTripId]) return prev;
      const stepsKey = archived.type === 'morning' ? 'morningSteps' : 'eveningSteps';
      const { type, archivedAt, tripId, ...stepData } = archived;
      const trip = next.trips[targetTripId];
      next.trips = {
        ...next.trips,
        [targetTripId]: {
          ...trip,
          [stepsKey]: [...(trip[stepsKey] || []), stepData],
        }
      };
      return next;
    });
  };

  const handleDeletePermanent = (stepId) => {
    setData(prev => {
      const next = { ...prev };
      const archived = (next.archivedSteps || []).find(s => s.id === stepId);
      next.archivedSteps = next.archivedSteps.filter(s => s.id !== stepId);
      // Also remove the orphan product if no other step references it (across all trips)
      if (archived?.productId) {
        const stillReferenced = Object.values(next.trips || {}).some(trip =>
          [...(trip.morningSteps || []), ...(trip.eveningSteps || [])].some(s => s.productId === archived.productId)
        );
        if (!stillReferenced) {
          const { [archived.productId]: _, ...rest } = next.products;
          next.products = rest;
        }
      }
      return next;
    });
  };

  // Skin journal
  const updateSkinNote = (note) => {
    setData(prev => {
      const cur = prev.skinJournal[dateKey] || { tags: [], note: '' };
      return { ...prev, skinJournal: { ...prev.skinJournal, [dateKey]: { ...cur, note } } };
    });
  };
  const toggleSkinTag = (tagId) => {
    setData(prev => {
      const cur = prev.skinJournal[dateKey] || { tags: [], note: '' };
      const tags = cur.tags || [];
      const next = tags.includes(tagId) ? tags.filter(x => x !== tagId) : [...tags, tagId];
      return { ...prev, skinJournal: { ...prev.skinJournal, [dateKey]: { ...cur, tags: next } } };
    });
  };
  const saveSkinEntry = () => {
    setData(prev => {
      const cur = prev.skinJournal[dateKey] || { tags: [], note: '' };
      return { ...prev, skinJournal: { ...prev.skinJournal, [dateKey]: { ...cur, savedAt: Date.now() } } };
    });
  };

  // Export / import
  const handleExport = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `cosmetics-backup-${todayKey()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
  const handleImport = (parsed) => {
    if (!parsed || typeof parsed !== 'object') {
      alert('הקובץ לא תקין.');
      return;
    }
    const ok = confirm('שחזור יחליף את כל הנתונים הקיימים. להמשיך?');
    if (!ok) return;
    setData(migrate(parsed));
    setShowArchive(false);
  };

  // Trip management
  const handleSwitchTrip = (tripId) => {
    if (!data.trips?.[tripId]) return;
    setData(prev => ({ ...prev, currentTripId: tripId }));
    // Reset morning collapse so the new trip's morning is open
    setMorningCollapsed(false);
    setAutoCollapsedKey(null);
  };

  const handleCreateTrip = ({ name, startDate, endDate, copyFromTripId }) => {
    setData(prev => {
      const next = { ...prev };
      const newId = uid();
      let morningSteps = [];
      let eveningSteps = [];
      if (copyFromTripId && next.trips[copyFromTripId]) {
        // Deep copy steps with fresh IDs (so completions don't collide)
        const source = next.trips[copyFromTripId];
        morningSteps = (source.morningSteps || []).map(s => ({ ...s, id: uid() }));
        eveningSteps = (source.eveningSteps || []).map(s => ({ ...s, id: uid() }));
      }
      next.trips = {
        ...next.trips,
        [newId]: {
          id: newId,
          name: name || 'Trip חדש',
          isDefault: false,
          startDate: startDate || null,
          endDate: endDate || null,
          morningSteps,
          eveningSteps,
        }
      };
      next.tripOrder = [...(next.tripOrder || []), newId];
      next.currentTripId = newId;
      return next;
    });
    setMorningCollapsed(false);
    setAutoCollapsedKey(null);
  };

  const handleUpdateTrip = (tripId, updates) => {
    setData(prev => {
      const next = { ...prev };
      if (!next.trips[tripId]) return prev;
      next.trips = {
        ...next.trips,
        [tripId]: { ...next.trips[tripId], ...updates }
      };
      return next;
    });
  };

  const handleDeleteTrip = (tripId) => {
    setData(prev => {
      const next = { ...prev };
      if (!next.trips[tripId] || next.trips[tripId].isDefault) return prev;
      // Find default trip to fall back to
      const defaultTrip = Object.values(next.trips).find(t => t.isDefault) || Object.values(next.trips)[0];
      // Remove the trip
      const { [tripId]: _, ...remainingTrips } = next.trips;
      next.trips = remainingTrips;
      next.tripOrder = (next.tripOrder || []).filter(id => id !== tripId);
      if (next.currentTripId === tripId) {
        next.currentTripId = defaultTrip ? defaultTrip.id : (next.tripOrder[0] || null);
      }
      return next;
    });
  };

  const handleDismissBanner = (key) => {
    setData(prev => ({
      ...prev,
      dismissedTripBanners: { ...(prev.dismissedTripBanners || {}), [key]: true }
    }));
  };

  const skinEntry = data.skinJournal[dateKey] || { tags: [], note: '' };
  const isToday = dateKey === todayKey();
  const today = todayKey();

  // Compute trip banner state (only show when viewing today)
  const tripBannerProps = useMemo(() => {
    if (!isToday) return null;
    const dismissed = data.dismissedTripBanners || {};
    // Scenario 1: a non-active trip's startDate is today → suggest switching in
    for (const t of Object.values(data.trips || {})) {
      if (t.id === data.currentTripId) continue;
      if (t.startDate === today && !dismissed[`${t.id}-start`]) {
        return { scheduledTrip: t, activeTrip: null };
      }
    }
    // Scenario 2: the active trip's endDate is today → suggest switching out
    const active = data.trips?.[data.currentTripId];
    if (active && active.endDate === today && !dismissed[`${active.id}-end`]) {
      const defaultTrip = Object.values(data.trips).find(t => t.isDefault);
      if (defaultTrip && defaultTrip.id !== active.id) {
        return { scheduledTrip: null, activeTrip: { ...active, defaultId: defaultTrip.id } };
      }
    }
    return null;
  }, [data.trips, data.currentTripId, data.dismissedTripBanners, today, isToday]);

  return (
    <div className="min-h-screen pb-24" style={{ paddingTop: 'env(safe-area-inset-top, 0)' }}>
      <div className="max-w-md mx-auto px-4 pt-4">
        {/* Header */}
        <div className="flex items-center justify-between mb-4 px-1">
          <div>
            <h1 className="text-2xl font-bold text-stone-800 font-serif-he flex items-center gap-2">
              <Icon name="sparkles" className="w-5 h-5 text-rose-500" />
              שגרת הטיפוח
            </h1>
            <div className="text-xs text-stone-500 mt-0.5">
              {DAYS_FULL_HE[currentDay]} · {formatDate(dateKey)} {isToday && <span className="text-rose-600 font-medium">· היום</span>}
            </div>
          </div>
          <button
            onClick={() => setShowArchive(true)}
            className="p-2.5 rounded-full bg-white/70 hover:bg-white text-stone-600 border border-stone-200/60 transition-colors"
            aria-label="ארכיון"
          >
            <Icon name="archive" className="w-5 h-5" />
          </button>
        </div>

        {tripBannerProps && (
          <TripBanner
            scheduledTrip={tripBannerProps.scheduledTrip}
            activeTrip={tripBannerProps.activeTrip}
            currentTripId={data.currentTripId}
            onSwitch={handleSwitchTrip}
            onDismiss={handleDismissBanner}
          />
        )}

        <TripSwitcher
          trips={data.trips || {}}
          tripOrder={data.tripOrder || []}
          currentTripId={data.currentTripId}
          onSwitch={handleSwitchTrip}
          onManage={() => setShowTripManager(true)}
        />

        <WeekStrip
          dateKey={dateKey}
          onChangeDate={setDateKey}
          completions={data.completions}
          morningSteps={morningSteps}
          eveningSteps={eveningSteps}
        />

        {/* Render order: when morning is collapsed, evening visually moves up naturally because it's after */}
        <RoutineSection
          kind="morning"
          steps={morningSteps}
          products={data.products}
          completions={data.completions[dateKey] || {}}
          currentDay={currentDay}
          dateKey={dateKey}
          allData={data}
          onToggleStep={(id) => toggleStep('morning', id)}
          isCollapsed={morningCollapsed}
          onToggleCollapse={() => setMorningCollapsed(v => !v)}
          onAddStep={() => setAddStepKind('morning')}
          onEditStep={(s) => setEditStep({ kind: 'morning', step: s })}
          onEditProduct={(s) => setEditProduct({ product: data.products[s.productId] })}
          onReplaceProduct={(s) => setReplaceProduct({ product: data.products[s.productId] })}
          onMoveStep={(id, delta) => handleMoveStep('morning', id, delta)}
          onArchiveStep={(s) => handleArchiveStep('morning', s)}
          openMenuId={openMenuId}
          onOpenMenu={setOpenMenuId}
        />

        <RoutineSection
          kind="evening"
          steps={eveningSteps}
          products={data.products}
          completions={data.completions[dateKey] || {}}
          currentDay={currentDay}
          dateKey={dateKey}
          allData={data}
          onToggleStep={(id) => toggleStep('evening', id)}
          isCollapsed={false}
          onToggleCollapse={() => {}}
          onAddStep={() => setAddStepKind('evening')}
          onEditStep={(s) => setEditStep({ kind: 'evening', step: s })}
          onEditProduct={(s) => setEditProduct({ product: data.products[s.productId] })}
          onReplaceProduct={(s) => setReplaceProduct({ product: data.products[s.productId] })}
          onMoveStep={(id, delta) => handleMoveStep('evening', id, delta)}
          onArchiveStep={(s) => handleArchiveStep('evening', s)}
          openMenuId={openMenuId}
          onOpenMenu={setOpenMenuId}
        />

        <SkinJournalSection
          dateKey={dateKey}
          entry={skinEntry}
          onToggleTag={toggleSkinTag}
          onUpdateNote={updateSkinNote}
          onSave={saveSkinEntry}
        />

        <div className="text-center text-[11px] text-stone-400 py-4">
          הנתונים נשמרים בטלפון שלך 💙
        </div>
      </div>

      {/* DIALOGS */}
      {addStepKind && (
        <StepDialog
          mode="add"
          kind={addStepKind}
          currentDay={currentDay}
          existingSteps={addStepKind === 'morning' ? morningSteps : eveningSteps}
          initial={null}
          productSuggestions={productSuggestions}
          onClose={() => setAddStepKind(null)}
          onConfirm={(payload) => handleAddStep(addStepKind, payload)}
        />
      )}

      {editStep && (() => {
        const linkedProduct = editStep.step.productId ? data.products[editStep.step.productId] : null;
        return (
          <StepDialog
            mode="edit"
            kind={editStep.kind}
            currentDay={currentDay}
            existingSteps={editStep.kind === 'morning' ? morningSteps : eveningSteps}
            initial={{
              name: editStep.step.name,
              productName: linkedProduct?.name || '',
              instructions: editStep.step.instructions,
              optional: editStep.step.optional,
              days: editStep.step.days,
              goal: linkedProduct?.goal ?? null,
              goalDays: linkedProduct?.goalDays ?? null,
              price: linkedProduct?.price ?? null,
              notes: linkedProduct?.notes ?? '',
              linkedProductId: linkedProduct?.id ?? null,
            }}
            productSuggestions={productSuggestions}
            onClose={() => setEditStep(null)}
            onConfirm={(payload) => handleEditStep(editStep.kind, editStep.step, payload)}
          />
        );
      })()}

      {replaceProduct && replaceProduct.product && (
        <ReplaceProductDialog
          product={replaceProduct.product}
          daysUsed={countProductDays(data, replaceProduct.product.id, replaceProduct.product.slotStartDate)}
          onClose={() => setReplaceProduct(null)}
          onConfirm={(payload) => handleReplaceProduct(replaceProduct.product, payload)}
        />
      )}

      {showArchive && (
        <ArchivePanel
          data={data}
          onClose={() => setShowArchive(false)}
          onRestoreStep={handleRestoreStep}
          onDeletePermanent={handleDeletePermanent}
          onExport={handleExport}
          onImport={handleImport}
        />
      )}

      {showTripManager && (
        <TripManagerDialog
          data={data}
          onClose={() => setShowTripManager(false)}
          onCreate={handleCreateTrip}
          onUpdate={handleUpdateTrip}
          onDelete={handleDeleteTrip}
          onSwitch={handleSwitchTrip}
        />
      )}

      {openMenuId && (() => {
        // Find the step + which list it's in
        let openStep = morningSteps.find(s => s.id === openMenuId);
        let kind = 'morning';
        if (!openStep) {
          openStep = eveningSteps.find(s => s.id === openMenuId);
          kind = 'evening';
        }
        if (!openStep) return null;

        const product = openStep.productId ? data.products[openStep.productId] : null;
        const list = kind === 'morning' ? morningSteps : eveningSteps;
        const fullIdx = list.findIndex(s => s.id === openStep.id);

        return (
          <StepActionsSheet
            stepName={openStep.name}
            onClose={() => setOpenMenuId(null)}
            onEdit={() => { setOpenMenuId(null); setEditStep({ kind, step: openStep }); }}
            onReplace={product ? () => { setOpenMenuId(null); setReplaceProduct({ product }); } : null}
            onMoveUp={fullIdx > 0 ? () => handleMoveStep(kind, openStep.id, -1) : null}
            onMoveDown={fullIdx < list.length - 1 ? () => handleMoveStep(kind, openStep.id, 1) : null}
            onArchive={() => { setOpenMenuId(null); handleArchiveStep(kind, openStep); }}
          />
        );
      })()}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>

const formatDate = (d) => {
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
};

const startOfWeek = (d) => {
  const date = new Date(d);
  const day = date.getDay();
  date.setDate(date.getDate() - day);
  date.setHours(0, 0, 0, 0);
  return date;
};

const addDays = (d, n) => {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
};

const STORAGE_KEY = 'skincare-tracker-v1';

const makeInitialState = () => ({
  products: JSON.parse(JSON.stringify(DEFAULT_PRODUCTS)),
  morningSteps: JSON.parse(JSON.stringify(DEFAULT_MORNING_STEPS)),
  eveningSteps: JSON.parse(JSON.stringify(DEFAULT_EVENING_STEPS)),
  archivedSteps: [],
  data: {},
  journal: {},
});

// Migration: legacy data was just { 'YYYY-MM-DD': { morning, evening } }
const migrate = (raw) => {
  if (!raw) return makeInitialState();
  if (raw.products) {
    return { ...makeInitialState(), ...raw };
  }
  return { ...makeInitialState(), data: raw };
};

// Count distinct days a product was used (since its startDate)
function countProductDays(productId, data, morningSteps, eveningSteps, startDate) {
  const dates = new Set();
  Object.entries(data).forEach(([date, dayData]) => {
    if (startDate && date < startDate) return;

    const mornUsed = (dayData.morning || []).some(stepId => {
      const step = morningSteps.find(s => s.id === stepId);
      return step?.productId === productId;
    });

    const dow = new Date(date).getDay();
    const evSteps = eveningSteps[dow] || [];
    const eveUsed = (dayData.evening || []).some(stepId => {
      const step = evSteps.find(s => s.id === stepId);
      return step?.productId === productId;
    });

    if (mornUsed || eveUsed) dates.add(date);
  });
  return dates.size;
}

  const [weekStart, setWeekStart] = useState(startOfWeek(new Date()));

  const [modal, setModal] = useState(null);
  const [userExpandedMorning, setUserExpandedMorning] = useState(false);

  // Load Google Fonts
  useEffect(() => {
    const link = document.createElement('link');
    link.href = 'https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Heebo:wght@300;400;500;700&display=swap';
    link.rel = 'stylesheet';
    document.head.appendChild(link);
    return () => { try { document.head.removeChild(link); } catch (e) {} };
  }, []);

  // Load state
  useEffect(() => {
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        setState(migrate(JSON.parse(stored)));
      }
    } catch (e) {
      // first time / corrupted
    }
    setLoaded(true);
  }, []);

  const dateKey = formatDate(selectedDate);

  // Reset morning expand-override when date changes
  useEffect(() => { setUserExpandedMorning(false); }, [dateKey]);

  const save = (newState) => {
    setState(newState);
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(newState));
    } catch (e) { console.error('Save failed', e); }
  };

  const dayOfWeek = selectedDate.getDay();
  const todayKey = formatDate(new Date());
  const eveningStepsForDay = state.eveningSteps[dayOfWeek] || [];
  const dayData = state.data[dateKey] || { morning: [], evening: [] };
  const morningChecks = dayData.morning || [];
  const eveningChecks = dayData.evening || [];

  const morningProgress = state.morningSteps.length ? morningChecks.length / state.morningSteps.length : 0;
  const eveningProgress = eveningStepsForDay.length ? eveningChecks.length / eveningStepsForDay.length : 0;

  const morningAllChecked = state.morningSteps.length > 0 && morningChecks.length >= state.morningSteps.length;
  const morningCollapsed = morningAllChecked && !userExpandedMorning;

  // === Mutations ===
  const toggleStep = (period, stepId) => {
    const current = state.data[dateKey] || { morning: [], evening: [] };
    const list = current[period] || [];
    const newList = list.includes(stepId) ? list.filter(id => id !== stepId) : [...list, stepId];
    save({
      ...state,
      data: { ...state.data, [dateKey]: { ...current, [period]: newList } }
    });
  };

  const replaceProduct = (productId, rating, note, newName) => {
    const product = state.products[productId];
    if (!product) return;

    const daysUsed = countProductDays(productId, state.data, state.morningSteps, state.eveningSteps, product.startDate);
    const today = formatDate(new Date());
    const historyEntry = {
      name: product.name,
      startDate: product.startDate,
      endDate: today,
      daysUsed,
      rating,
      note,
    };

    save({
      ...state,
      products: {
        ...state.products,
        [productId]: {
          name: newName,
          startDate: today,
          history: [...(product.history || []), historyEntry],
        }
      }
    });
    setModal(null);
  };

  const addStep = (period, dow, stepData) => {
    const productId = `custom_${Date.now()}`;
    const stepId = `${period === 'morning' ? 'm' : 'e'}_${Date.now()}`;
    const newProduct = {
      name: stepData.productName,
      startDate: formatDate(new Date()),
      history: [],
    };
    const newStep = {
      id: stepId,
      productId,
      name: stepData.name,
      detail: stepData.detail || '',
      optional: !!stepData.optional,
    };

    const newProducts = { ...state.products, [productId]: newProduct };

    if (period === 'morning') {
      save({ ...state, products: newProducts, morningSteps: [...state.morningSteps, newStep] });
    } else {
      save({
        ...state,
        products: newProducts,
        eveningSteps: {
          ...state.eveningSteps,
          [dow]: [...(state.eveningSteps[dow] || []), newStep],
        },
      });
    }
    setModal(null);
  };

  const archiveStep = (period, dow, stepId) => {
    let stepToArchive = null;
    let newState = { ...state };

    if (period === 'morning') {
      stepToArchive = state.morningSteps.find(s => s.id === stepId);
      newState.morningSteps = state.morningSteps.filter(s => s.id !== stepId);
    } else {
      stepToArchive = (state.eveningSteps[dow] || []).find(s => s.id === stepId);
      newState.eveningSteps = {
        ...state.eveningSteps,
        [dow]: (state.eveningSteps[dow] || []).filter(s => s.id !== stepId),
      };
    }

    if (!stepToArchive) return;

    newState.archivedSteps = [...state.archivedSteps, {
      period,
      dayOfWeek: period === 'evening' ? dow : null,
      step: stepToArchive,
      archivedAt: formatDate(new Date()),
    }];

    save(newState);
  };

  const restoreStep = (idx) => {
    const archived = state.archivedSteps[idx];
    if (!archived) return;

    let newState = { ...state, archivedSteps: state.archivedSteps.filter((_, i) => i !== idx) };

    if (archived.period === 'morning') {
      newState.morningSteps = [...state.morningSteps, archived.step];
    } else {
      const dow = archived.dayOfWeek;
      newState.eveningSteps = {
        ...state.eveningSteps,
        [dow]: [...(state.eveningSteps[dow] || []), archived.step],
      };
    }
    save(newState);

        <div className="text-stone-600" style={{ fontFamily: "'Frank Ruhl Libre', serif" }}>טוען...</div>

      <ArchiveScreen

        </div>

        {/* Week strip */}
        <div className="bg-white/60 backdrop-blur-sm rounded-2xl p-3 mb-6 shadow-sm border border-rose-100/50">
          <div className="flex items-center justify-between mb-2 px-1">
            <button onClick={() => setWeekStart(addDays(weekStart, -7))} className="text-stone-400 hover:text-stone-700 p-1 transition-colors">
              <ChevronRight className="w-4 h-4" />
            </button>
            <span className="text-xs text-stone-500 font-medium">השבוע</span>
            <button onClick={() => setWeekStart(addDays(weekStart, 7))} className="text-stone-400 hover:text-stone-700 p-1 transition-colors">
              <ChevronLeft className="w-4 h-4" />
            </button>
          </div>
          <div className="grid grid-cols-7 gap-1">
            {weekDays.map((d, i) => {
              const isSelected = formatDate(d) === dateKey;
              const isToday = formatDate(d) === todayKey;
              const dKey = formatDate(d);
              const dDay = state.data[dKey];
              const dDayOfWeek = d.getDay();
              const totalSteps = state.morningSteps.length + (state.eveningSteps[dDayOfWeek]?.length || 0);
              const checked = (dDay?.morning?.length || 0) + (dDay?.evening?.length || 0);
              const dProgress = totalSteps ? Math.min(checked / totalSteps, 1) : 0;

              return (
                <button
                  key={i}
                  onClick={() => setSelectedDate(d)}
                  className={`flex flex-col items-center py-2 rounded-xl transition-all ${
                    isSelected ? 'bg-rose-200/70 shadow-inner' : 'hover:bg-rose-50'
                  }`}
                >
                  <span className="text-xs text-stone-500">{shortDays[i]}</span>
                  <span className={`text-base font-bold ${isToday ? 'text-rose-700' : 'text-stone-700'}`}>
                    {d.getDate()}
                  </span>
                  <div className="w-6 h-0.5 mt-1 rounded-full bg-stone-200/70 overflow-hidden">
                    <div className="h-full bg-emerald-500 transition-all" style={{ width: `${dProgress * 100}%` }} />
                  </div>
                </button>
              );
            })}
          </div>
        </div>

        {/* Morning */}
        <RoutineSection
          icon={<Sun className="w-5 h-5" />}
          title="בוקר"
          subtitle="שגרת בוקר קבועה"
          progress={morningProgress}
          steps={state.morningSteps}
          checked={morningChecks}
          products={state.products}
          productCounts={productCounts}
          onToggle={(id) => toggleStep('morning', id)}
          onReplace={(productId, currentName) => setModal({ type: 'replace', productId, currentName })}
          onArchiveStep={(stepId) => archiveStep('morning', null, stepId)}
          onAddStep={() => setModal({ type: 'addStep', period: 'morning' })}
          accent="amber"
          collapsible={morningAllChecked}
          collapsed={morningCollapsed}
          onToggleCollapse={() => setUserExpandedMorning(!userExpandedMorning)}
        />

        {/* Evening */}
        <RoutineSection
          icon={<Moon className="w-5 h-5" />}
          title="ערב"
          subtitle={EVENING_LABELS[dayOfWeek]}
          progress={eveningProgress}
          steps={eveningStepsForDay}
          checked={eveningChecks}
          products={state.products}
          productCounts={productCounts}
          onToggle={(id) => toggleStep('evening', id)}
          onReplace={(productId, currentName) => setModal({ type: 'replace', productId, currentName })}
          onArchiveStep={(stepId) => archiveStep('evening', dayOfWeek, stepId)}
          onAddStep={() => setModal({ type: 'addStep', period: 'evening', dayOfWeek })}
          accent="indigo"
        />

        {/* Skin Journal */}
        <SkinJournalSection
          dateKey={dateKey}
          entry={journalEntry}
          onToggleTag={toggleJournalTag}
          onUpdateNote={(note) => updateJournal({ note })}
        />

        {/* Footer */}
        <div className="text-center text-xs text-stone-500 mt-6 pb-6 flex items-center justify-center gap-1.5">
          <Sparkles className="w-3 h-3 text-amber-500" />
          <span>הנתונים נשמרים אוטומטית · המספר ליד כל מוצר = מספר ימי שימוש</span>
        </div>

      </div>

      {/* Modals */}
      {modal?.type === 'replace' && (
        <ReplaceProductDialog
          currentName={modal.currentName}
          onClose={() => setModal(null)}
          onConfirm={(rating, note, newName) => replaceProduct(modal.productId, rating, note, newName)}
        />
      )}
      {modal?.type === 'addStep' && (
        <AddStepDialog
          period={modal.period}
          dayOfWeek={modal.dayOfWeek}
          onClose={() => setModal(null)}
          onConfirm={(stepData) => addStep(modal.period, modal.dayOfWeek, stepData)}
        />
      )}
    </div>
  );
}

// ============== ROUTINE SECTION ==============
function RoutineSection({
  icon, title, subtitle, progress, steps, checked, products, productCounts,
  onToggle, onReplace, onArchiveStep, onAddStep, accent,
  collapsible, collapsed, onToggleCollapse
}) {
  const accentColors = {
    amber: { iconBg: 'bg-amber-100', iconText: 'text-amber-700', progress: 'bg-amber-400' },
    indigo: { iconBg: 'bg-indigo-100', iconText: 'text-indigo-700', progress: 'bg-indigo-400' },
  };
  const c = accentColors[accent];

  return (
    <div className="bg-white/80 backdrop-blur-sm rounded-3xl p-5 mb-4 shadow-sm border border-stone-200/40 transition-all duration-500">
      <div
        onClick={collapsible ? onToggleCollapse : undefined}
        className={collapsible ? 'cursor-pointer select-none' : ''}
      >
        <div className="flex items-center justify-between mb-1">
          <div className="flex items-center gap-3">
            <div className={`${c.iconBg} ${c.iconText} p-2 rounded-full`}>{icon}</div>
            <div>
              <h2 className="text-xl font-bold text-stone-800" style={{ fontFamily: "'Frank Ruhl Libre', serif" }}>{title}</h2>
              <p className="text-xs text-stone-500">{subtitle}</p>
            </div>
          </div>
          <div className="flex items-center gap-2">
            {collapsible && collapsed && (
              <span className="text-xs text-emerald-700 bg-emerald-50 px-2 py-1 rounded-full flex items-center gap-1 font-medium">
                <Check className="w-3 h-3" /> הושלם
              </span>
            )}
            <div className="text-sm text-stone-600 font-medium">
              {checked.length}/{steps.length}
            </div>
            {collapsible && (
              <ChevronUp className={`w-4 h-4 text-stone-400 transition-transform duration-300 ${collapsed ? 'rotate-180' : ''}`} />
            )}
          </div>
        </div>

        <div className="w-full h-1 bg-stone-100 rounded-full overflow-hidden mb-4 mt-2">
          <div className={`h-full ${c.progress} transition-all duration-500`} style={{ width: `${progress * 100}%` }} />
        </div>
      </div>

      <div
        className="overflow-hidden transition-all duration-500"
        style={{
          maxHeight: collapsed ? '0px' : '4000px',
          opacity: collapsed ? 0 : 1,
          marginTop: collapsed ? '-16px' : '0',
        }}
      >
        <div className="space-y-2">
          {steps.map(step => (
            <StepRow
              key={step.id}
              step={step}
              isChecked={checked.includes(step.id)}
              productName={step.productId ? products[step.productId]?.name : null}
              productDays={step.productId ? productCounts[step.productId] : null}
              onToggle={() => onToggle(step.id)}
              onReplace={step.productId ? () => onReplace(step.productId, products[step.productId]?.name) : null}
              onArchive={() => onArchiveStep(step.id)}
            />
          ))}

          <button
            onClick={onAddStep}
            className="w-full p-3 rounded-2xl border-2 border-dashed border-stone-300 text-stone-500 hover:border-emerald-400 hover:text-emerald-600 hover:bg-emerald-50/30 transition-all flex items-center justify-center gap-2 text-sm font-medium"
          >
            <Plus className="w-4 h-4" />
            <span>הוספת צעד</span>
          </button>
        </div>
      </div>
    </div>
  );
}

// ============== MODAL WRAPPER ==============
function Modal({ children, onClose, title }) {
  // Lock body scroll
  useEffect(() => {
    const original = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => { document.body.style.overflow = original; };
  }, []);

  return (
    <div
      dir="rtl"
      className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-2 sm:p-4"
      style={{ background: 'rgba(40, 25, 25, 0.45)', backdropFilter: 'blur(2px)', fontFamily: "'Heebo', sans-serif" }}
      onClick={onClose}
    >
      <div
        className="bg-white rounded-3xl w-full max-w-md p-5 shadow-2xl border border-stone-200"
        style={{ maxHeight: '92vh', overflowY: 'auto' }}
        onClick={(e) => e.stopPropagation()}
      >
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-xl font-bold text-stone-800" style={{ fontFamily: "'Frank Ruhl Libre', serif" }}>{title}</h3>
          <button onClick={onClose} className="text-stone-400 hover:text-stone-700 p-1 rounded-full hover:bg-stone-100" aria-label="סגירה">
            <X className="w-5 h-5" />
          </button>
        </div>
        {children}
      </div>
    </div>
  );
}

// ============== STAR RATING ==============
function StarRating({ rating, onChange, size = 'md', readOnly = false }) {
  const sizeClass = size === 'lg' ? 'w-8 h-8' : size === 'sm' ? 'w-3.5 h-3.5' : 'w-5 h-5';
  return (
    <div className="flex gap-1" dir="ltr">
      {[1, 2, 3, 4, 5].map(n => (
        <button
          key={n}
          type="button"
          onClick={readOnly ? undefined : () => onChange(n)}
          className={readOnly ? 'cursor-default' : 'transition-transform hover:scale-110'}
          aria-label={`${n} כוכבים`}
        >
          <Star
            className={`${sizeClass} ${n <= rating ? 'fill-amber-400 text-amber-400' : 'text-stone-300'}`}
          />
        </button>
      ))}
    </div>
  );
}

// ============== SKIN JOURNAL ==============
function SkinJournalSection({ dateKey, entry, onToggleTag, onUpdateNote }) {
  const [localNote, setLocalNote] = useState(entry.note || '');

  // Sync from external state when date changes
  useEffect(() => {
    setLocalNote(entry.note || '');
  }, [dateKey]);

  // Debounced save
  useEffect(() => {
    if (localNote === (entry.note || '')) return;
    const t = setTimeout(() => onUpdateNote(localNote), 500);
    return () => clearTimeout(t);
  }, [localNote]);

  const tags = entry.tags || [];

  return (
    <div className="bg-white/80 backdrop-blur-sm rounded-3xl p-5 mb-4 shadow-sm border border-stone-200/40">
      <div className="flex items-center gap-3 mb-3">
        <div className="bg-emerald-100 text-emerald-700 p-2 rounded-full">
          <BookOpen className="w-5 h-5" />
        </div>
        <div>
          <h2 className="text-xl font-bold text-stone-800" style={{ fontFamily: "'Frank Ruhl Libre', serif" }}>יומן עור</h2>
          <p className="text-xs text-stone-500">איך העור הרגיש היום?</p>
        </div>
      </div>

      <div className="flex flex-wrap gap-2 mb-3">
        {SKIN_TAGS.map(tag => {
          const active = tags.includes(tag.id);
          return (
            <button
              key={tag.id}
              onClick={() => onToggleTag(tag.id)}
              className={`text-sm px-3 py-1.5 rounded-full border transition-all ${
                active
                  ? 'bg-emerald-100 border-emerald-300 text-emerald-800 font-medium shadow-sm'
                  : 'bg-stone-50 border-stone-200 text-stone-600 hover:bg-stone-100'
              }`}
            >
              {tag.label}
            </button>
          );
        })}
      </div>

      <textarea
        value={localNote}
        onChange={(e) => setLocalNote(e.target.value)}
        placeholder="הערה לעצמך... (למשל: 'מתחת לעיניים מאוד יבש היום')"
        className="w-full p-3 border border-stone-200 rounded-2xl text-sm resize-none bg-stone-50/60 focus:outline-none focus:border-emerald-300"
        style={{ fontFamily: "'Heebo', sans-serif" }}
        rows={2}
      />
    </div>
  );
}

// ============== ARCHIVE SCREEN ==============
function ArchiveScreen({ products, archivedSteps, onClose, onRestoreStep, onDeleteStep }) {
  const [tab, setTab] = useState('products');
  const [confirmDeleteIdx, setConfirmDeleteIdx] = useState(null);

  // Build flat product history list
  const productHistory = [];
  Object.entries(products).forEach(([id, p]) => {
    (p.history || []).forEach(h => {
      productHistory.push({ ...h, slot: id });
    });
  });
  productHistory.sort((a, b) => (b.endDate || '').localeCompare(a.endDate || ''));

  return (
    <div dir="rtl" className="min-h-screen" style={{
      background: 'linear-gradient(135deg, #FAF5EF 0%, #F5E8E0 50%, #EDD9D0 100%)',
      fontFamily: "'Heebo', sans-serif"
    }}>
      <div className="max-w-2xl mx-auto px-4 py-6">

        {/* Header */}
        <div className="flex items-center justify-between mb-6">
          <button
            onClick={onClose}
            className="bg-white/60 backdrop-blur-sm hover:bg-white/80 p-2.5 rounded-full text-stone-700 transition-all border border-stone-200/50 shadow-sm flex items-center gap-1 px-4"
          >
            <ChevronRight className="w-5 h-5" />
            <span className="text-sm font-medium">חזרה</span>
          </button>

          <h1 className="text-2xl font-bold text-stone-800" style={{ fontFamily: "'Frank Ruhl Libre', serif" }}>
            ארכיון
          </h1>

          <div className="w-20" />
        </div>

        {/* Tabs */}
        <div className="bg-white/60 backdrop-blur-sm rounded-2xl p-1 flex gap-1 mb-6 shadow-sm border border-stone-200/40">
          <button
            onClick={() => setTab('products')}
            className={`flex-1 py-2.5 rounded-xl text-sm font-medium transition-all ${
              tab === 'products' ? 'bg-rose-200/80 text-rose-900 shadow-sm' : 'text-stone-600 hover:bg-white/40'
            }`}
          >
            מוצרים שהוחלפו {productHistory.length > 0 && `(${productHistory.length})`}
          </button>
          <button
            onClick={() => setTab('steps')}
            className={`flex-1 py-2.5 rounded-xl text-sm font-medium transition-all ${
              tab === 'steps' ? 'bg-rose-200/80 text-rose-900 shadow-sm' : 'text-stone-600 hover:bg-white/40'
            }`}
          >
            צעדים שהוסרו {archivedSteps.length > 0 && `(${archivedSteps.length})`}
          </button>
        </div>

        {/* Products Tab */}
        {tab === 'products' && (
          productHistory.length === 0 ? (
            <div className="bg-white/60 rounded-3xl p-8 text-center border border-stone-200/40">
              <div className="text-stone-400 mb-3">
                <Archive className="w-10 h-10 mx-auto" />
              </div>
              <p className="text-stone-600 text-sm leading-relaxed">
                עדיין לא החלפת מוצרים.<br />
                כשתחליפי מוצר, ההיסטוריה תופיע כאן עם הדירוג וההערה.
              </p>
            </div>
          ) : (
            <div className="space-y-3">
              {productHistory.map((h, i) => (
                <div key={i} className="bg-white/80 backdrop-blur-sm rounded-2xl p-4 shadow-sm border border-stone-200/40">
                  <div className="flex items-start justify-between mb-2 gap-2">
                    <div className="font-bold text-stone-800 text-base">{h.name}</div>
                    <StarRating rating={h.rating || 0} onChange={() => {}} size="sm" readOnly />
                  </div>
                  <div className="text-xs text-stone-500 mb-2">
                    {h.startDate ? `${h.startDate} → ${h.endDate}` : `עד ${h.endDate}`}
                    {' · '}
                    <span className="font-medium text-amber-700">
                      {h.daysUsed === 1 ? 'יום שימוש 1' : `${h.daysUsed} ימי שימוש`}
                    </span>
                  </div>
                  {h.note && (
                    <div className="text-sm text-stone-700 bg-stone-50 p-2.5 rounded-xl border border-stone-100">
                      "{h.note}"
                    </div>
                  )}
                </div>
              ))}
            </div>
          )
        )}

        {/* Steps Tab */}
        {tab === 'steps' && (
          archivedSteps.length === 0 ? (
            <div className="bg-white/60 rounded-3xl p-8 text-center border border-stone-200/40">
              <div className="text-stone-400 mb-3">
                <Trash2 className="w-10 h-10 mx-auto" />
              </div>
              <p className="text-stone-600 text-sm leading-relaxed">
                עדיין לא הסרת צעדים.<br />
                כשתסירי צעד, הוא יופיע כאן ותוכלי להחזיר אותו לשגרה.
              </p>
            </div>
          ) : (
            <div className="space-y-3">
              {archivedSteps.map((a, i) => (
                <div key={i} className="bg-white/80 backdrop-blur-sm rounded-2xl p-4 shadow-sm border border-stone-200/40">
                  <div className="mb-2">
                    <div className="font-bold text-stone-800">{a.step.name}</div>
                    <div className="text-xs text-stone-500 mt-0.5">
                      {a.period === 'morning' ? '🌞 בוקר' : `🌙 יום ${hebrewDays[a.dayOfWeek]} בערב`}
                      {' · הוסר ב-'}{a.archivedAt}
                    </div>
                  </div>
                  {a.step.detail && (
                    <div className="text-sm text-stone-600 mb-3">{a.step.detail}</div>
                  )}
                  <div className="flex gap-2">
                    <button
                      onClick={() => onRestoreStep(i)}
                      className="text-sm px-3 py-2 rounded-xl bg-emerald-100 text-emerald-800 font-medium hover:bg-emerald-200 transition-colors flex items-center gap-1.5"
                    >
                      <RotateCcw className="w-3.5 h-3.5" />
                      <span>החזירי לשגרה</span>
                    </button>
                    {confirmDeleteIdx === i ? (
                      <>
                        <button
                          onClick={() => { onDeleteStep(i); setConfirmDeleteIdx(null); }}
                          className="text-sm px-3 py-2 rounded-xl bg-rose-500 text-white font-medium hover:bg-rose-600 transition-colors flex items-center gap-1.5"
                        >
                          <Trash2 className="w-3.5 h-3.5" />
                          <span>בטוח? מחקי לצמיתות</span>
                        </button>
                        <button
                          onClick={() => setConfirmDeleteIdx(null)}
                          className="text-sm px-3 py-2 rounded-xl bg-stone-100 text-stone-600 hover:bg-stone-200 transition-colors"
                        >
                          ביטול
                        </button>
                      </>
                    ) : (
                      <button
                        onClick={() => setConfirmDeleteIdx(i)}
                        className="text-sm px-3 py-2 rounded-xl bg-stone-100 text-stone-600 hover:bg-stone-200 transition-colors flex items-center gap-1.5"
                      >
                        <Trash2 className="w-3.5 h-3.5" />
                        <span>מחקי לצמיתות</span>
                      </button>
                    )}
                  </div>
                </div>
              ))}
            </div>
          )
        )}
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<SkincareTracker />);
</script>
</body>
</html>
